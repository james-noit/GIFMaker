@if (frameStore.count() > 0) {
  <div class="timeline-wrap">
    <div
      #scroller
      class="timeline"
      cdkDropList
      cdkDropListOrientation="horizontal"
      (cdkDropListDropped)="onDrop($event)"
      (scroll)="updateScrollState()"
    >
      @for (frame of frameStore.frames(); track trackById($index, frame)) {
        <div cdkDrag class="timeline__cell">
          <app-timeline-item
            [frame]="frame"
            [index]="$index"
            [active]="playback.isPlaying() && playback.activeIndex() === $index"
            (remove)="remove($event)"
          />
          <div class="timeline__placeholder" *cdkDragPlaceholder></div>
        </div>
      }
    </div>

    @if (canScrollLeft()) {
      <button
        type="button"
        class="timeline-nav timeline-nav--left"
        aria-label="Scroll timeline left"
        (click)="scrollByAmount(-1)"
      >
        <app-icon name="chevron-left" [size]="18" />
      </button>
    }

    @if (canScrollRight()) {
      <button
        type="button"
        class="timeline-nav timeline-nav--right"
        aria-label="Scroll timeline right"
        (click)="scrollByAmount(1)"
      >
        <app-icon name="chevron-right" [size]="18" />
      </button>
    }
  </div>
} @else {
  <p class="timeline__empty">Your timeline will appear here once you add photos.</p>
}

<div class="controls">
  <button
    type="button"
    class="controls__play"
    [disabled]="frameStore.count() === 0"
    (click)="playback.toggle()"
  >
    @if (playback.isPlaying()) {
      <app-icon name="pause" [size]="15" />
      <span>Pause</span>
    } @else {
      <app-icon name="play" [size]="15" />
      <span>Play</span>
    }
  </button>

  <label class="controls__delay">
    Delay
    <input
      type="number"
      min="0.1"
      step="0.1"
      [ngModel]="frameStore.delayMs() / 1000"
      (ngModelChange)="onDelayInput($event)"
    />
    s
  </label>
</div>
